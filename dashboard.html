<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bengkel Pro SaaS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { scrollbar-width: thin; scrollbar-color: #475569 transparent; font-family: 'Plus Jakarta Sans', sans-serif; }
  :root { --gf: #d97706; --gt: #ea580c; }
  .glass { background: linear-gradient(135deg, rgba(15,23,42,.9), rgba(30,41,59,.85)); border: 1px solid rgba(148,163,184,.12); backdrop-filter: blur(16px); border-radius: 1rem; }
  .stat-card { background: linear-gradient(135deg, rgba(15,23,42,.95), rgba(30,41,59,.9)); border: 1px solid rgba(148,163,184,.1); border-radius: 1rem; padding: 1.25rem; transition: transform .2s, border-color .2s; }
  .stat-card:hover { transform: translateY(-3px); border-color: #d9770680; }
  .btn-primary { background: linear-gradient(135deg, #d97706, #ea580c); color: #fff; padding: .6rem 1.25rem; border-radius: .75rem; font-weight: 700; transition: all .2s; box-shadow: 0 4px 14px #d9770640; }
  .btn-primary:hover { opacity: .9; transform: translateY(-1px); }
  .badge { padding: .2rem .65rem; border-radius: 9999px; font-size: .75rem; font-weight: 700; display: inline-block; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(8px); z-index: 50; display: flex; items-center: center; justify-content: center; }
  .fade-in { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  [x-cloak] { display: none !important; }
</style>
<script>
tailwind.config={darkMode:'class',theme:{extend:{colors:{'gf':'#d97706','gt':'#ea580c'}}}}
</script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<nav class="sticky top-0 z-40 border-b border-slate-800/60 bg-slate-950/80 backdrop-blur-xl">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
    <div class="flex items-center gap-3">
      <a href="index.html" class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-gf to-gt text-base font-extrabold text-white shadow-lg">E</a>
      <span class="text-lg font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Bengkel Pro SaaS</span>
    </div>
    <div class="hidden items-center gap-2 md:flex">
      <button @click="tab='dashboard'" :class="tab==='dashboard'?'bg-white/10':''" class="rounded-lg px-3 py-1.5 text-sm font-medium transition hover:bg-white/10">Dashboard</button>
      <button @click="tab='kanban'" :class="tab==='kanban'?'bg-white/10':''" class="rounded-lg px-3 py-1.5 text-sm font-medium transition hover:bg-white/10">Kanban Servis</button>
      <button @click="tab='sparepart'" :class="tab==='sparepart'?'bg-white/10':''" class="rounded-lg px-3 py-1.5 text-sm font-medium transition hover:bg-white/10">Sparepart</button>
      <button @click="tab='teknisi'" :class="tab==='teknisi'?'bg-white/10':''" class="rounded-lg px-3 py-1.5 text-sm font-medium transition hover:bg-white/10">Teknisi</button></div>
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-xs text-slate-400 hover:text-white transition-colors">Landing Page</a>
      <a href="login.html" class="text-xs text-slate-400 hover:text-white transition-colors">Logout</a>
    </div>
  </div>
</nav>
<main class="mx-auto max-w-7xl px-4 py-6">

<div x-data="{
  tab:'dashboard',
  servis:[],
  sparepart:[],
  teknisi:[],
  showModal:false,modalType:'',editIdx:-1,form:{},

  openAdd(type){this.modalType=type;this.editIdx=-1;this.form={};this.showModal=true},
  del(arr,idx){if(confirm('Hapus data?'))arr.splice(idx,1)},
  save(arr){if(this.editIdx>=0)arr[this.editIdx]={...this.form};else arr.push({...this.form});this.showModal=false},
  moveServis(idx,newStatus){this.servis[idx].status=newStatus},
  getServis(status){return this.servis.filter(s=>(s.status||'antrian')===status)},
  lowStock(sp){return(sp.stok||sp.stock||0)<=(sp.min_stok||sp.min_stock||5)},
  exportCSV(arr,name){
    if(!arr.length)return;
    const h=Object.keys(arr[0]).join(',');
    const b=arr.map(r=>Object.values(r).map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(h+'\n'+b);
    a.download=name+'.csv';a.click();
  }
}" x-cloak>

  <!-- STAT CARDS -->
  <div x-show="tab==='dashboard'" class="fade-in">
    <div class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
      <div class="stat-card">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-amber-500/20 text-amber-400 text-lg">&#x1F527;</div>
          <div><div class="text-xs text-slate-400">Total Servis</div><div class="text-2xl font-bold" x-text="servis.length">0</div></div>
        </div>
      </div>
      <div class="stat-card">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-orange-500/20 text-orange-400 text-lg">&#x1F6E0;</div>
          <div><div class="text-xs text-slate-400">Sparepart Stok</div><div class="text-2xl font-bold" x-text="sparepart.length">0</div></div>
        </div>
      </div>
      <div class="stat-card">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-emerald-500/20 text-emerald-400 text-lg">&#x1F4B5;</div>
          <div><div class="text-xs text-slate-400">Teknisi Aktif</div><div class="text-2xl font-bold" x-text="teknisi.length">0</div></div>
        </div>
      </div>
    </div>

    <!-- Quick Kanban Overview -->
    <div class="glass p-5 mb-6">
      <h2 class="mb-4 text-lg font-bold">&#x1F527; Status Servis Hari Ini</h2>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
        <div class="rounded-xl bg-amber-500/10 border border-amber-500/20 p-4">
          <div class="mb-2 text-sm font-bold text-amber-300">Antrian</div>
          <template x-for="(s,i) in servis.filter(x=>(x.status||'antrian')==='antrian')" :key="i">
            <div class="mb-1 rounded-lg bg-slate-800/60 p-2 text-xs"><span class="text-slate-200" x-text="s.nama||s.customer||'-'"></span></div>
          </template>
        </div>
        <div class="rounded-xl bg-blue-500/10 border border-blue-500/20 p-4">
          <div class="mb-2 text-sm font-bold text-blue-300">Dikerjakan</div>
          <template x-for="(s,i) in servis.filter(x=>(x.status||'antrian')==='dikerjakan')" :key="i">
            <div class="mb-1 rounded-lg bg-slate-800/60 p-2 text-xs"><span class="text-slate-200" x-text="s.nama||s.customer||'-'"></span></div>
          </template>
        </div>
        <div class="rounded-xl bg-emerald-500/10 border border-emerald-500/20 p-4">
          <div class="mb-2 text-sm font-bold text-emerald-300">Selesai</div>
          <template x-for="(s,i) in servis.filter(x=>(x.status||'antrian')==='selesai')" :key="i">
            <div class="mb-1 rounded-lg bg-slate-800/60 p-2 text-xs"><span class="text-slate-200" x-text="s.nama||s.customer||'-'"></span></div>
          </template>
        </div>
      </div>
    </div>

    <!-- Low stock alerts -->
    <div class="glass p-5">
      <h2 class="mb-3 text-lg font-bold">&#x26A0;&#xFE0F; Stok Menipis</h2>
      <div class="grid grid-cols-1 gap-2 sm:grid-cols-2">
        <template x-for="(sp,i) in sparepart.filter(s=>(s.stok||s.stock||0)<=(s.min_stok||s.min_stock||5))" :key="i">
          <div class="flex items-center justify-between rounded-lg bg-red-500/10 border border-red-500/20 p-3">
            <div>
              <div class="text-sm font-semibold text-slate-200" x-text="sp.nama||sp.name||'-'"></div>
              <div class="text-xs text-red-400">Stok: <span x-text="sp.stok||sp.stock||0"></span></div>
            </div>
            <span class="badge bg-red-500/20 text-red-300">Low</span>
          </div>
        </template>
        <template x-if="sparepart.filter(s=>(s.stok||s.stock||0)<=(s.min_stok||s.min_stock||5)).length===0">
          <div class="text-sm text-slate-500">Semua stok aman.</div>
        </template>
      </div>
    </div>
  </div>

  <!-- KANBAN TAB -->
  <div x-show="tab==='kanban'" class="fade-in">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-xl font-bold">Kanban Servis</h2>
      <button @click="openAdd('servis')" class="btn-primary">+ Tambah Job</button>
    </div>
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
      <!-- Antrian -->
      <div class="rounded-xl bg-amber-500/5 border border-amber-500/15 p-4">
        <div class="mb-3 flex items-center justify-between">
          <span class="text-sm font-bold text-amber-300">&#x1F4E6; Antrian</span>
          <span class="badge bg-amber-500/20 text-amber-300" x-text="getServis('antrian').length"></span>
        </div>
        <template x-for="(s,i) in servis.filter(x=>(x.status||'antrian')==='antrian')" :key="i">
          <div class="glass mb-2 rounded-lg p-3 border border-slate-700/30">
            <div class="flex justify-between items-start mb-1">
              <div class="text-sm font-semibold" x-text="s.nama||s.customer||'-'"></div>
              <div class="flex gap-1">
                <button @click="del(servis,servis.indexOf(s))" class="text-xs text-red-400 hover:text-red-300">&times;</button>
              </div>
            </div>
            <div class="text-xs text-slate-400" x-text="s.kendaraan||s.vehicle||s.jenis||'-'"></div>
            <div class="text-xs text-slate-500" x-text="s.keluhan||s.note||''"></div>
            <button @click="moveServis(servis.indexOf(s),'dikerjakan')" class="mt-2 w-full rounded bg-amber-500/20 px-2 py-1 text-xs font-medium text-amber-300 hover:bg-amber-500/30">Mulai &#x2192;</button>
          </div>
        </template>
      </div>
      <!-- Dikerjakan -->
      <div class="rounded-xl bg-blue-500/5 border border-blue-500/15 p-4">
        <div class="mb-3 flex items-center justify-between">
          <span class="text-sm font-bold text-blue-300">&#x1F527; Dikerjakan</span>
          <span class="badge bg-blue-500/20 text-blue-300" x-text="getServis('dikerjakan').length"></span>
        </div>
        <template x-for="(s,i) in servis.filter(x=>(x.status||'antrian')==='dikerjakan')" :key="i">
          <div class="glass mb-2 rounded-lg p-3 border border-slate-700/30">
            <div class="flex justify-between items-start mb-1">
              <div class="text-sm font-semibold" x-text="s.nama||s.customer||'-'"></div>
              <button @click="del(servis,servis.indexOf(s))" class="text-xs text-red-400 hover:text-red-300">&times;</button>
            </div>
            <div class="text-xs text-slate-400" x-text="s.kendaraan||s.vehicle||s.jenis||'-'"></div>
            <div class="text-xs text-slate-500" x-text="s.teknisi||s.mechanic||''"></div>
            <button @click="moveServis(servis.indexOf(s),'selesai')" class="mt-2 w-full rounded bg-emerald-500/20 px-2 py-1 text-xs font-medium text-emerald-300 hover:bg-emerald-500/30">Selesai &#x2714;</button>
          </div>
        </template>
      </div>
      <!-- Selesai -->
      <div class="rounded-xl bg-emerald-500/5 border border-emerald-500/15 p-4">
        <div class="mb-3 flex items-center justify-between">
          <span class="text-sm font-bold text-emerald-300">&#x2705; Selesai</span>
          <span class="badge bg-emerald-500/20 text-emerald-300" x-text="getServis('selesai').length"></span>
        </div>
        <template x-for="(s,i) in servis.filter(x=>(x.status||'antrian')==='selesai')" :key="i">
          <div class="glass mb-2 rounded-lg p-3 border border-slate-700/30 opacity-70">
            <div class="flex justify-between items-start mb-1">
              <div class="text-sm font-semibold" x-text="s.nama||s.customer||'-'"></div>
              <button @click="del(servis,servis.indexOf(s))" class="text-xs text-red-400 hover:text-red-300">&times;</button>
            </div>
            <div class="text-xs text-slate-400" x-text="s.kendaraan||s.vehicle||s.jenis||'-'"></div>
            <div class="text-xs text-emerald-400" x-text="'Rp'+Number(s.biaya||s.cost||0).toLocaleString('id-ID')"></div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- SPAREPART TAB -->
  <div x-show="tab==='sparepart'" class="fade-in">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-xl font-bold">Inventori Sparepart</h2>
      <div class="flex gap-2">
        <button @click="exportCSV(sparepart,'sparepart')" class="rounded-lg bg-slate-700 px-3 py-1.5 text-xs hover:bg-slate-600">Export CSV</button>
        <button @click="openAdd('sparepart')" class="btn-primary">+ Tambah Sparepart</button>
      </div>
    </div>
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
      <template x-for="(sp,i) in sparepart" :key="i">
        <div class="glass p-4 rounded-xl border border-slate-700/30" :class="lowStock(sp)?'border-red-500/30':''">
          <div class="flex justify-between items-start mb-2">
            <div class="text-sm font-bold text-amber-300" x-text="sp.nama||sp.name||'-'"></div>
            <button @click="del(sparepart,i)" class="text-xs text-red-400 hover:text-red-300">Hapus</button>
          </div>
          <div class="space-y-1 text-xs text-slate-400">
            <div>Kode: <span class="text-slate-200" x-text="sp.kode||sp.code||sp.id||'-'"></span></div>
            <div>Harga: <span class="text-emerald-300" x-text="'Rp'+Number(sp.harga||sp.price||0).toLocaleString('id-ID')"></span></div>
            <div>Stok:
              <span :class="lowStock(sp)?'text-red-400 font-bold':'text-slate-200'" x-text="sp.stok||sp.stock||0"></span>
              <span x-show="lowStock(sp)" class="badge bg-red-500/20 text-red-300 ml-1">Menipis!</span>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- TEKNISI TAB -->
  <div x-show="tab==='teknisi'" class="fade-in">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-xl font-bold">Daftar Teknisi</h2>
      <div class="flex gap-2">
        <button @click="exportCSV(teknisi,'teknisi')" class="rounded-lg bg-slate-700 px-3 py-1.5 text-xs hover:bg-slate-600">Export CSV</button>
        <button @click="openAdd('teknisi')" class="btn-primary">+ Tambah Teknisi</button>
      </div>
    </div>
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
      <template x-for="(t,i) in teknisi" :key="i">
        <div class="glass p-4 rounded-xl border border-slate-700/30">
          <div class="flex justify-between items-start mb-1">
            <div class="text-sm font-bold text-orange-300" x-text="t.nama||t.name||'-'"></div>
            <button @click="del(teknisi,i)" class="text-xs text-red-400 hover:text-red-300">Hapus</button>
          </div>
          <div class="text-xs text-slate-400">Spesialisasi: <span class="text-slate-200" x-text="t.spesialisasi||t.specialization||t.keahlian||'-'"></span></div>
          <div class="text-xs text-slate-500" x-text="t.telepon||t.phone||''"></div>
        </div>
      </template>
    </div>
  </div>

  <!-- MODAL -->
  <div x-show="showModal" x-cloak class="modal-overlay fade-in" @click.self="showModal=false">
    <div class="glass w-full max-w-md p-6 mx-4" @click.stop>
      <div class="mb-4 flex items-center justify-between">
        <h3 class="text-lg font-bold" x-text="editIdx>=0?'Edit Data':'Tambah Data'"></h3>
        <button @click="showModal=false" class="text-slate-400 hover:text-white">&times;</button>
      </div>
      <template x-if="modalType==='servis'">
        <div class="space-y-3">
          <input x-model="form.nama" placeholder="Nama Pelanggan" class="w-full rounded-lg bg-slate-800 border border-slate-600 px-3 py-2 text-sm focus:border-amber-500 focus:outline-none">
          <input x-model="form.kendaraan" placeholder="Kendaraan (contoh: Honda Beat 2022)" class="w-full rounded-lg bg-slate-800 border border-slate-600 px-3 py-2 text-sm focus:border-amber-500 focus:outline-none">
          <input x-model="form.keluhan" placeholder="Keluhan/Keterangan" class="w-full rounded-lg bg-slate-800 border border-slate-600 px-3 py-2 text-sm focus:border-amber-500 focus:outline-none">
          <input x-model="form.teknisi" placeholder="Teknisi" class="w-full rounded-lg bg-slate-800 border border-slate-600 px-3 py-2 text-sm focus:border-amber-500 focus:outline-none">
          <input x-model="form.biaya" type="number" placeholder="Biaya (Rp)" class="w-full rounded-lg bg-slate-800 border border-slate-600 px-3 py-2 text-sm focus:border-amber-500 focus:outline-none">
          <select x-model="form.status" class="w-full rounded-lg bg-slate-800 border border-slate-600 px-3 py-2 text-sm focus:border-amber-500 focus:outline-none">
            <option value="antrian">Antrian</option><option value="dikerjakan">Dikerjakan</option><option value="selesai">Selesai</option>
          </select>
          <button @click="save(servis)" class="btn-primary w-full">Simpan</button>
        </div>
      </template>
      <template x-if="modalType==='sparepart'">
        <div class="space-y-3">
          <input x-model="form.kode" placeholder="Kode Sparepart" class="w-full rounded-lg bg-slate-800 border border-slate-600 px-3 py-2 text-sm focus:border-amber-500 focus:outline-none">
          <input x-model="form.nama" placeholder="Nama Sparepart" class="w-full rounded-lg bg-slate-800 border border-slate-600 px-3 py-2 text-sm focus:border-amber-500 focus:outline-none">
          <input x-model="form.harga" type="number" placeholder="Harga (Rp)" class="w-full rounded-lg bg-slate-800 border border-slate-600 px-3 py-2 text-sm focus:border-amber-500 focus:outline-none">
          <input x-model="form.stok" type="number" placeholder="Stok" class="w-full rounded-lg bg-slate-800 border border-slate-600 px-3 py-2 text-sm focus:border-amber-500 focus:outline-none">
          <button @click="save(sparepart)" class="btn-primary w-full">Simpan</button>
        </div>
      </template>
      <template x-if="modalType==='teknisi'">
        <div class="space-y-3">
          <input x-model="form.nama" placeholder="Nama Teknisi" class="w-full rounded-lg bg-slate-800 border border-slate-600 px-3 py-2 text-sm focus:border-amber-500 focus:outline-none">
          <input x-model="form.spesialisasi" placeholder="Spesialisasi" class="w-full rounded-lg bg-slate-800 border border-slate-600 px-3 py-2 text-sm focus:border-amber-500 focus:outline-none">
          <input x-model="form.telepon" placeholder="Telepon" class="w-full rounded-lg bg-slate-800 border border-slate-600 px-3 py-2 text-sm focus:border-amber-500 focus:outline-none">
          <button @click="save(teknisi)" class="btn-primary w-full">Simpan</button>
        </div>
      </template>
    </div>
  </div>
</div>
</main>
</body>
</html>
