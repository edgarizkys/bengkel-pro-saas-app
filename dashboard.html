<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Bengkel Pro SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#EF4444', dark: '#1F2937' } } }
        }
    </script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex">
        <aside class="w-64 bg-dark text-white p-6">
            <h1 class="text-2xl font-bold mb-10 text-primary">Bengkel Pro</h1>
            <nav class="space-y-4">
                <a href="#" class="block py-2 px-4 bg-primary rounded">Dashboard</a>
                <a href="#" class="block py-2 px-4 hover:bg-gray-700 rounded">Servis</a>
                <a href="#" class="block py-2 px-4 hover:bg-gray-700 rounded">Inventaris</a>
            </nav>
        </aside>

        <main class="flex-1 p-8">
            <header class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-bold text-gray-800">Ringkasan Operasional</h2>
                <button class="bg-primary text-white px-4 py-2 rounded shadow">+ Servis Baru</button>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-gray-500 text-sm">Total Pendapatan</h3>
                    <p class="text-3xl font-bold text-gray-800">Rp 450.000</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-gray-500 text-sm">Servis Aktif</h3>
                    <p class="text-3xl font-bold text-gray-800">2</p>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="p-4">Plat Nomor</th>
                            <th class="p-4">Pelanggan</th>
                            <th class="p-4">Servis</th>
                            <th class="p-4">Status</th>
                        </tr>
                    </thead>
                    <tbody id="service-table">
                        <!-- Data injected via app.js -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
