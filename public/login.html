<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bengkel Pro SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #EF4444, #1F2937); }
    </style>
</head>
<body class="bg-gray-900 h-screen flex items-center justify-center">
    <div class="w-full max-w-md p-8 bg-gray-800 rounded-xl shadow-2xl border border-gray-700">
        <h2 class="text-2xl font-bold text-white mb-6 text-center">Bengkel Pro Login</h2>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Email</label>
                <input type="email" id="email" class="w-full p-3 bg-gray-700 rounded border border-gray-600 text-white focus:ring-2 focus:ring-red-500 outline-none" required>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Password</label>
                <input type="password" id="password" class="w-full p-3 bg-gray-700 rounded border border-gray-600 text-white focus:ring-2 focus:ring-red-500 outline-none" required>
            </div>
            <button type="submit" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded transition">Masuk</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (res.ok) window.location.href = '/dashboard.html';
                else alert('Login gagal');
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
